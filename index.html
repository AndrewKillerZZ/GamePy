<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Python Quest Menu</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* Убираем полосу прокрутки для красоты */
        ::-webkit-scrollbar { width: 0; }
        
        .glass-effect { 
            background: rgba(255, 255, 255, 1); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .active-scale:active { 
            transform: scale(0.97); 
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-gray-100 text-slate-900 select-none pb-10">

    <!-- 
      ШАПКА (HEADER)
      z-50 = чтобы она всегда была ПОВЕРХ кнопок при прокрутке
      sticky top-0 = прилипает к верху экрана
    -->
    <div class="bg-blue-600 pt-4 pb-6 px-4 rounded-b-[30px] shadow-lg sticky top-0 z-50">
        
        <!-- Верхняя строка: Название и Аватар -->
        <div class="flex justify-between items-center mb-4 text-white">
            <div class="flex items-center gap-2">
                <!-- Иконка змеи -->
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                    <span class="text-xl">🐍</span>
                </div>
                <div>
                    <h1 class="text-lg font-bold italic tracking-wide">PYTHON QUEST</h1>
                    <p class="text-xs text-blue-200 opacity-80">Level 1 • Novice</p>
                </div>
            </div>
            
            <!-- Аватарка справа -->
            <div id="user-photo" class="w-10 h-10 bg-white text-blue-600 rounded-full flex items-center justify-center font-bold shadow-md border-2 border-blue-400">
                ?
            </div>
        </div>

        <!-- Поисковая строка -->
        <div class="relative">
            <span class="absolute left-4 top-3.5 text-gray-400">🔍</span>
            <input type="text" id="search" placeholder="Поиск по меню..." 
                class="w-full bg-white text-slate-800 py-3 pl-10 pr-4 rounded-xl shadow-md outline-none focus:ring-2 focus:ring-blue-300 transition-all text-sm font-medium">
        </div>
    </div>

    <!-- 
      СПИСОК КНОПОК
      mt-4 = отступ сверху (margin-top), чтобы не наезжало на поиск
      px-4 = отступы по бокам
    -->
    <div class="px-3 mt-4 space-y-3" id="menu-container">
        <!-- Сюда JavaScript вставит кнопки -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        // Берем имя пользователя, если доступно
        if (tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            // Если есть фото (в реальном боте), можно вставить img, пока ставим первую букву
            document.getElementById('user-photo').innerText = user.first_name[0].toUpperCase();
        }

        // Список кнопок (Данные)
        const menuItems = [
            { id: 'continue', title: 'Продолжить', sub: 'Вернуться к уроку 5', icon: '▶️', color: 'bg-blue-100 text-blue-600' },
            { id: 'new_game', title: 'Новая игра', sub: 'Начать с нуля', icon: '🆕', color: 'bg-emerald-100 text-emerald-600' },
            { id: 'ranking', title: 'Рейтинг', sub: 'Топ игроков', icon: '🏆', color: 'bg-amber-100 text-amber-600' },
            { id: 'settings', title: 'Настройки', sub: 'Звук и язык', icon: '⚙️', color: 'bg-slate-100 text-slate-600' },
            { id: 'shop', title: 'Магазин', sub: 'Купить подсказки', icon: '🛒', color: 'bg-purple-100 text-purple-600' },
            { id: 'exit', title: 'Выход', sub: 'Закрыть игру', icon: '🚪', color: 'bg-rose-100 text-rose-600' }
        ];

        function renderMenu(filter = '') {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            menuItems.forEach(item => {
                if (!item.title.toLowerCase().includes(filter.toLowerCase())) return;

                const card = document.createElement('div');
                // Стили карточки: белая, скругленная, с тенью
                card.className = "glass-effect p-3 rounded-[20px] flex items-center justify-between active-scale transition-transform cursor-pointer border border-white";
                card.onclick = () => sendData(item.id, item.title);
                
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <!-- Иконка слева (Круглая) -->
                        <div class="w-12 h-12 ${item.color} rounded-full flex items-center justify-center text-xl shrink-0">
                            ${item.icon}
                        </div>
                        
                        <!-- Текст -->
                        <div class="flex flex-col">
                            <span class="font-bold text-gray-800 text-[15px] leading-tight">${item.title}</span>
                            <span class="text-gray-400 text-[12px] font-medium mt-0.5">${item.sub}</span>
                        </div>
                    </div>

                    <!-- Кнопка Play справа (как на втором скриншоте) -->
                    <div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center shadow-md shadow-blue-200">
                        <svg width="12" height="14" viewBox="0 0 14 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12.5 6.26795C13.1667 6.65285 13.1667 7.6151 12.5 8L3.5 13.1962C2.83333 13.5811 2 13.0999 2 12.3301L2 1.93782C2 1.16802 2.83333 0.686896 3.5 1.0718L12.5 6.26795Z" fill="white"/>
                        </svg>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function sendData(id, title) {
            // Вибрация при нажатии (приятный тактильный отклик)
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            const data = JSON.stringify({ action: id, name: title });
            tg.sendData(data);
            tg.close();
        }

        document.getElementById('search').oninput = (e) => renderMenu(e.target.value);
        renderMenu();
    </script>
</body>
</html>
