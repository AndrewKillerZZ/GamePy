<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Python Quest Menu</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar { width: 0; }
        
        .glass-effect { 
            background: rgba(255, 255, 255, 1); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .active-scale:active { 
            transform: scale(0.97); 
            background-color: #eff6ff;
        }

        /* Анимация модального окна */
        #info-modal { transition: opacity 0.25s ease-out; }
        .modal-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .modal-visible { opacity: 1; visibility: visible; pointer-events: auto; }

        .title-click-anim:active { transform: scale(0.95); opacity: 0.8; }
        
        /* Стиль для секретного кода */
        .code-easter-egg:active { background-color: #e2e8f0; transform: scale(0.98); }
    </style>
</head>
<body class="bg-gray-100 text-slate-900 select-none pb-10">

    <!-- ШАПКА -->
    <div class="bg-blue-600 pt-6 pb-6 px-5 rounded-b-[35px] shadow-lg sticky top-0 z-40">
        <div class="flex justify-between items-center text-white">
            <div class="flex items-center gap-3" onclick="handleTitleClick()">
                <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-sm shadow-inner transition-transform title-click-anim">
                    <span class="text-2xl">🐍</span>
                </div>
                <div class="cursor-pointer title-click-anim">
                    <h1 class="text-xl font-extrabold italic tracking-wide uppercase select-none">PYTHON QUEST</h1>
                </div>
            </div>
            
            <button onclick="showInfo()" class="w-11 h-11 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center font-bold shadow-lg backdrop-blur-md transition-colors border border-white/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div class="px-4 mt-6 space-y-3.5" id="menu-container"></div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="info-modal" class="modal-hidden fixed inset-0 z-50 flex items-center justify-center px-4">
        <div id="modal-overlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        
        <div class="relative bg-white rounded-[32px] p-8 w-full max-w-sm shadow-2xl transform transition-all">
            
            <!-- КНОПКА ЗАКРЫТИЯ (X) -->
            <button onclick="toggleModal(false)" class="absolute top-5 right-5 w-9 h-9 flex items-center justify-center bg-gray-100 text-gray-500 rounded-full active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>

            <div class="text-center mb-6 mt-2">
                <div id="modal-icon" class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-sm italic">🎓</div>
                <h2 id="modal-title" class="text-2xl font-black text-gray-800 tracking-tight leading-tight"></h2>
            </div>

            <div id="modal-content" class="text-gray-600 text-[15px] leading-relaxed text-center mb-8"></div>

            <button id="modal-btn-ok" onclick="toggleModal(false)" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-200 active:scale-95 transition-transform">
                Понятно!
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let savedProgress = localStorage.getItem('python_quest_level') || "Урок 5: Циклы While";
        let isSecretActive = localStorage.getItem('easter_egg_1_active') === 'true';

        // Счетчики для пасхалок
        let titleClickCount = 0;
        let codeClickCount = 0;
        let clickTimer;

        // Обработка 5 нажатий на заголовок
        function handleTitleClick() {
            titleClickCount++;
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            if (titleClickCount === 5) {
                if (!isSecretActive) {
                    showFirstSecret();
                    isSecretActive = true;
                    localStorage.setItem('easter_egg_1_active', 'true');
                } else {
                    showSecondSecret();
                }
                titleClickCount = 0;
            }
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { titleClickCount = 0; }, 1500);
        }

        // Обработка 5 нажатий на текст кода (внутри модалки)
        function handleCodeClick() {
            codeClickCount++;
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            if (codeClickCount === 5) {
                showCraneSecret();
                codeClickCount = 0;
            }
            // Сброс счетчика кода, если долго не нажимать
            setTimeout(() => { codeClickCount = 0; }, 3000);
        }

        const menuItems = [
            { id: 'continue', title: 'Продолжить', sub: savedProgress, icon: '▶️', color: 'bg-blue-100 text-blue-600' },
            { id: 'multiplayer', title: 'Мультиплеер', sub: 'PvP Битва скриптов', icon: '⚔️', color: 'bg-purple-100 text-purple-600' },
            { id: 'new_game', title: 'Новая игра', sub: 'Начать с нуля', icon: '🆕', color: 'bg-emerald-100 text-emerald-600' },
            { id: 'ranking', title: 'Рейтинг', sub: 'Топ игроков', icon: '🏆', color: 'bg-amber-100 text-amber-600' },
            { id: 'settings', title: 'Настройки', sub: 'Звук и язык', icon: '⚙️', color: 'bg-slate-100 text-slate-600' },
            { id: 'shop', title: 'Магазин', sub: 'Купить подсказки', icon: '🛒', color: 'bg-pink-100 text-pink-600' },
            { id: 'exit', title: 'Выход', sub: 'Закрыть игру', icon: '🚪', color: 'bg-rose-100 text-rose-600' }
        ];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menuItems.map(item => `
                <div onclick="sendData('${item.id}', '${item.title}')" class="glass-effect p-3.5 rounded-[24px] flex items-center justify-between active-scale transition-all cursor-pointer border border-white/60 mb-1">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 ${item.color} rounded-full flex items-center justify-center text-xl shrink-0 shadow-sm">${item.icon}</div>
                        <div class="flex flex-col text-left">
                            <span class="font-bold text-gray-800 text-[16px] leading-tight">${item.title}</span>
                            <span class="text-gray-400 text-[13px] font-medium mt-0.5">${item.sub}</span>
                        </div>
                    </div>
                    <div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-200/50">
                        <svg width="10" height="12" viewBox="0 0 14 16" fill="none"><path d="M12.5 6.26795C13.1667 6.65285 13.1667 7.6151 12.5 8L3.5 13.1962C2.83333 13.5811 2 13.0999 2 12.3301L2 1.93782C2 1.16802 2.83333 0.686896 3.5 1.0718L12.5 6.26795Z" fill="white"/></svg>
                    </div>
                </div>
            `).join('');
        }

        function sendData(id, title) {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            tg.sendData(JSON.stringify({ action: id, name: title }));
            tg.close();
        }

        function showInfo() {
            setModal('🎓', 'Об игре', `
                Изучай язык программирования в формате тактической игры.<br><br>
                🧩 <b>PvE:</b> Одиночные уровни с головоломками.<br>
                ⚔️ <b>PvP:</b> Баттлы алгоритмов против соперников.<br><br>
                Побеждает тот, чей код эффективнее!
                <div onclick="handleCodeClick()" class="bg-gray-100 p-3 rounded-xl text-center mt-4 border border-gray-200 active:bg-gray-200 transition-colors cursor-pointer code-easter-egg">
                    <code class="text-blue-600 font-bold font-mono text-sm">print("Good luck good day")</code>
                </div>
            `, true);
        }

        function showFirstSecret() {
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            setModal('🕵️‍♂️', 'Секрет открыт!', `
                Вы активировали секретную функцию в настройках, скорее проверяйте ее!
            `, false);
        }

        function showSecondSecret() {
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            setModal('🛠', 'Настоящий тестировщик', `
                Вы открыли одну из нескольких пасхалок в этой игре!<br><br>
                Секретная функция уже активирована! Ищите другие пасхалки! 😊
            `, false);
        }

        // ПАСХАЛКА С КАЙЛОМ КРЕЙНОМ
        function showCraneSecret() {
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            setModal('🧟‍♂️', 'Пасхалка!', `
                <b>Поздравляем, вы нашли пасхалку!</b><br><br>
                Кайл Крейн передает привет! 😊😁
            `, false);
        }

        function setModal(icon, title, content, isStandard) {
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = content;
            
            const btnOk = document.getElementById('modal-btn-ok');
            const overlay = document.getElementById('modal-overlay');

            if (isStandard) {
                btnOk.style.display = 'block';
                overlay.onclick = () => toggleModal(false); 
            } else {
                btnOk.style.display = 'none';
                overlay.onclick = null; 
            }
            toggleModal(true);
        }

        function toggleModal(show) {
            const modal = document.getElementById('info-modal');
            if (show) {
                modal.classList.remove('modal-hidden');
                modal.classList.add('modal-visible');
            } else {
                modal.classList.remove('modal-visible');
                modal.classList.add('modal-hidden');
            }
        }

        renderMenu();
    </script>
</body>
</html>
